spring.application.name=clinik
spring.datasource.url=jdbc:postgresql://localhost:5432/clinikdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/swagger-ui.html
server.servlet.context-path=/

# JWT: reemplazar en cada entorno por un secreto Base64 de al menos 256 bits.
clinik.security.jwt-secret=${CLINIK_JWT_SECRET:VGhpc0lzQURldm9wZXJvbmx5U2VjcmV0S2V5Rm9yQ2xpbmlrMjAyNg==}
clinik.security.jwt-expiration-ms=${CLINIK_JWT_EXPIRATION_MS:3600000}

# Logging configuration
logging.level.root=INFO
logging.file.name=logs/clinik.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
