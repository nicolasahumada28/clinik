services:
  db-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinikdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinikdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin-postgresql:
    image: dpage/pgadmin4:8.4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - admin-data:/var/lib/pgadmin
    depends_on:
      - db-postgresql

  clinik:
    build: .
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-postgresql:5432/clinikdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CLINIK_JWT_SECRET: ${CLINIK_JWT_SECRET:-VGhpc0lzQURldm9wZXJvbmx5U2VjcmV0S2V5Rm9yQ2xpbmlrMjAyNg==}
    depends_on:
      db-postgresql:
        condition: service_healthy

volumes:
  db-data:
  admin-data: