spring.application.name=clinik
spring.datasource.url=jdbc:postgresql://localhost:5432/clinikdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/swagger-ui.html
server.servlet.context-path=/

# Logging configuration
logging.level.root=INFO
logging.file.name=logs/clinik.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
