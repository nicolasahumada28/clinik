version: '3.9'
services:
  db-postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: clinikdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  admin-postgresql:
    image: dpage/pgadmin4:8.4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:5050'
    volumes:
      - admin-data:/var/lib/pgadmin
    depends_on:
      - db-postgresql

  clinik:
    build: .
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-postgresql:5432/clinikdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db-postgresql

volumes:
  db-data:
  admin-data: